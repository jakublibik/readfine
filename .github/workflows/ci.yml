name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: readfine_test
          POSTGRES_USER: readfine
          POSTGRES_PASSWORD: readfine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readfine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://readfine:readfine@localhost:5432/readfine_test
      SECRET_KEY: ci-test-secret-key-0123456789abcdef
      ENCRYPTION_KEY: ci0123456789abcdef0123456789abcd
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # setup-uv has no floating v8 major tag yet — pin the exact release.
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Run migrations on a clean database
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

      - name: Regenerate FEATURES.md from source
        run: uv run python ../scripts/gen_features.py

      - name: Fail if committed FEATURES.md is stale
        run: git diff --exit-code ../FEATURES.md

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Must satisfy the engines field in package.json: jsdom, which the JS tests
          # run the page in, needs 22.22+ and pulls an undici that calls Node APIs
          # absent before then. Kept at the version used for development, so a test
          # that passes locally means something here.
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run JS tests
        run: npm test

      - name: Build CSS
        run: npm run build

      - name: Fail if committed tailwind.css is stale
        run: git diff --exit-code backend/app/static/css/tailwind.css

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build .
