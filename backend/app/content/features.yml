# Single source of truth for the Readfine feature list.
#
# Rendered in-app at /features and generated into FEATURES.md at the repo root.
# After editing this file, regenerate the Markdown:
#
#     uv run python scripts/gen_features.py
#
# CI regenerates it and fails if the committed FEATURES.md is out of date.

intro: >-
  Everything Readfine does, grouped by area. Reading works out of the box; the
  AI features are an optional layer that runs on your own API key.

categories:
  - name: Feeds & subscriptions
    summary: Get content in, from anywhere.
    features:
      - title: RSS & Atom feeds
        desc: Subscribe to any standard feed URL.
      - title: Web-scraping feeds
        desc: >-
          Follow sites that have no feed. Point Readfine at a listing page and a
          CSS selector that matches the article links; with an AI key it can
          suggest the selector for you.
      - title: Authenticated feeds
        desc: >-
          Subscribe to feeds and scrape pages behind HTTP Basic Auth, in their own
          fields or written into the address. Either way the credentials are stored
          encrypted, per feed.
      - title: Folders
        desc: Group feeds into folders for organizing and for scoping filters.
      - title: Scheduled background fetching
        desc: >-
          New articles are pulled automatically on a schedule, with adaptive
          per-feed intervals that back off quiet feeds and check busy ones more
          often.
      - title: OPML import & export
        desc: >-
          Move your subscriptions in and out, including files compatible with
          Tiny Tiny RSS.

  - name: Reading experience
    summary: A clean reader that adapts to your screen.
    features:
      - title: Readable extraction
        desc: >-
          The full article text is pulled into the reader (`trafilatura`, with
          `readability-lxml` as a fallback), without the cookie banners and
          sidebars of the original page.
      - title: Straight to the source
        desc: >-
          Feeds that carry only headlines and links leave nothing to read. Such
          articles offer the original page as a button, and can open it in a new
          tab on click if you turn that on.
      - title: Videos play in the reader
        desc: >-
          A YouTube or Vimeo link is saved as the video, with its full description
          under it. Playing it starts the player in place, and nothing is requested
          from the video site until you press play.
      - title: Adaptive layout
        desc: >-
          Choose a 2- or 3-panel view per screen size, with breakpoints you set
          yourself.
      - title: Dedicated mobile layout
        desc: >-
          A real small-screen layout with a collapsible sidebar and inline or
          full-screen article view, not a squeezed-down desktop.
      - title: Search
        desc: >-
          Full-text search across your articles, scoped by feed, folder, status,
          or label. Open it from anywhere with the `/` shortcut.
      - title: Dark mode
        desc: Light, dark, or follow your system preference.
      - title: Reading typography
        desc: Choose the font family and text size for the reading view.
      - title: Number & date format
        desc: >-
          Pick how numbers and dates are written (decimal separator and date
          order) independently of the interface language, so English can pair
          with `1 234,56` and `25.06.2026`.
      - title: List density
        desc: >-
          Compact, comfortable, or summary, set separately for desktop and
          mobile.
      - title: Mark read on scroll
        desc: Optionally mark articles read as they scroll past.
      - title: Article states
        desc: Mark articles read, star favourites, and archive what you want out of the way.
      - title: Labels
        desc: Your own colour-coded tags for sorting articles by hand.
      - title: Save by URL
        desc: >-
          Paste a link to keep an article that is not in any of your feeds. It goes
          through the same readable extraction, lands in Saved, and is kept until you
          remove it. Also in the API, so a phone shortcut or a bookmarklet can save
          a link without opening the app.
      - title: Share by link
        desc: >-
          Hand a single article to someone with no Readfine account. The link reads
          without signing in and stays live until you revoke it.

  - name: Filtering & scoring
    summary: Trim the stream down to what matters.
    features:
      - title: Filters
        desc: >-
          Match on title, content, author, URL, or AI score, then automatically
          add a label, mark read, star, or archive.
      - title: Regex and AND/OR
        desc: >-
          Combine conditions with AND/OR and match with regular expressions
          (Python syntax) when plain "contains" is not enough.
      - title: Feed & folder scoping
        desc: Restrict any filter to specific feeds or folders.
      - title: Retroactive apply
        desc: Run a filter over existing articles, not just new ones.
      - title: Relevance scoring
        desc: >-
          With an AI key, each incoming article is scored against your interest
          profile, so you can surface or hide articles by score (a filter can
          mark anything below a threshold as read).

  - name: AI (bring your own key)
    summary: Optional AI on your own provider key.
    features:
      - title: Summaries
        desc: A one-tap summary of any article.
      - title: Chat over articles
        desc: Ask questions about an article and get answers grounded in its text.
      - title: Interest profile
        desc: >-
          Describe what you care about, or have the AI draft it from what you
          read; it drives scoring and digests.
      - title: Profile on a schedule
        desc: >-
          Have the profile regenerate itself every 2 or 4 weeks as your
          reading shifts, with the replaced version one click away.
      - title: Catch me up
        desc: >-
          An on-demand digest of what happened in your feeds over a period and
          scope you choose.
      - title: Scheduled briefings
        desc: The same digest on a schedule, delivered to your inbox.
      - title: Your choice of provider
        desc: >-
          Anthropic, OpenAI, or Google Gemini. Keys are per-user, stored
          encrypted, and used only for your own requests.
      - title: Custom prompts & models
        desc: >-
          Set a fast model for scoring and a quality model for summaries, chat,
          and briefings, each on the provider you pick. The summary and context
          prompts are editable, and each briefing can carry its own prompt.

  - name: Insights & stats
    summary: See how you actually read.
    features:
      - title: Reading stats
        desc: >-
          Your read rate, reading streak, average dwell time, and your single
          most active day and hour.
      - title: Scoring calibration
        desc: >-
          Check how well AI relevance scores match what you actually read, and
          surface "missed gems" the AI rated highly but you never opened.
      - title: AI usage & cost
        desc: An estimate of your AI spend per provider over time.

  - name: Accounts & administration
    summary: Multi-user, with the operator controls to match.
    features:
      - title: Per-user accounts
        desc: Every account has its own feeds, filters, labels, and preferences.
      - title: Admin panel
        desc: Manage users and instance-wide settings.
      - title: Email (SMTP)
        desc: Address verification, password reset, and briefing delivery.
      - title: API tokens
        desc: A JSON API authenticated with JWT tokens, for scripts and integrations.
      - title: Retention & purge
        desc: Tiered retention rules that purge old articles automatically.

  - name: Privacy & self-hosting
    summary: Self-hosted and fully open source.
    features:
      - title: Self-hosted
        desc: Runs on your own server with Docker; your data stays with you.
      - title: Open source
        desc: AGPL-3.0 licensed, so you can read and modify every line.
      - title: Encrypted key storage
        desc: AI keys and other secrets are stored encrypted at rest.
      - title: SSRF protection
        desc: Feed and scrape fetches are guarded against server-side request forgery.
      - title: Hosted option
        desc: >-
          Prefer not to self-host? Use the hosted instance at
          [readfine.app](https://readfine.app).
