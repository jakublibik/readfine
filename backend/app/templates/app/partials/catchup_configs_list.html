{% set period_labels = {"today": "Today", "yesterday": "Yesterday", "7days": "Last 7 days"} %}
{% if saved_configs %}
<ul class="space-y-1" id="catchup-configs-list">
  {% for cfg in saved_configs %}
  <li class="flex items-center justify-between gap-2 px-3 py-2 rounded border border-gray-200 bg-white hover:bg-gray-50"
      id="catchup-config-{{ cfg.id }}">
    <button type="button"
            class="flex-1 text-left truncate cursor-pointer bg-transparent border-0 p-0 min-w-0"
            data-action="load-catchup-config"
            data-config="{{ cfg | catchup_config_json }}">
      <span class="block text-sm text-gray-700 truncate">{{ cfg.name }}</span>
      <span class="block text-xs text-gray-400">{{ period_labels.get(cfg.period, cfg.period) }}</span>
    </button>
    <div class="flex items-center gap-1 flex-shrink-0">
      {# Briefing button #}
      <button type="button"
              class="bg-transparent border-0 cursor-pointer px-1 flex items-center
                {% if cfg.briefing_enabled %}text-blue-500 hover:text-blue-700
                {% elif smtp_available is defined and not smtp_available %}text-amber-400 hover:text-amber-600
                {% else %}text-gray-400 hover:text-blue-500{% endif %}"
              data-action="open-briefing-modal"
              data-config-id="{{ cfg.id }}"
              data-config-name="{{ cfg.name | e }}"
              title="{% if cfg.briefing_enabled %}Briefing: {{ cfg.briefing_interval | capitalize }}{% if cfg.briefing_interval == 'weekly' %} {{ ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][cfg.briefing_day or 0] }}{% endif %} {{ cfg.briefing_time or '08:00' }}{% elif smtp_available is defined and not smtp_available %}Email not configured{% else %}Set up briefing{% endif %}">
        {% if cfg.briefing_enabled %}
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
          <path d="M1.5 8.67v8.58a3 3 0 003 3h15a3 3 0 003-3V8.67l-8.928 5.493a3 3 0 01-3.144 0L1.5 8.67z"/>
          <path d="M22.5 6.908V6.75a3 3 0 00-3-3h-15a3 3 0 00-3 3v.158l9.714 5.978a1.5 1.5 0 001.572 0L22.5 6.908z"/>
        </svg>
        {% else %}
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        {% endif %}
      </button>
      {# Generate button #}
      <button type="button"
              class="text-gray-400 hover:text-green-600 bg-transparent border-0 cursor-pointer px-1 flex items-center"
              data-action="generate-catchup-config"
              data-config="{{ cfg | catchup_config_json }}"
              title="Load and generate">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </button>
      {# Three-dots menu #}
      <div class="relative" id="config-menu-container-{{ cfg.id }}">
        <button type="button"
                class="text-gray-400 hover:text-gray-600 bg-transparent border-0 cursor-pointer px-0.5 flex items-center"
                data-action="toggle-config-menu"
                data-config-id="{{ cfg.id }}"
                data-config-name="{{ cfg.name | e }}"
                title="More options">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
          </svg>
        </button>
        <div id="config-menu-{{ cfg.id }}"
             class="hidden absolute right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg py-1 z-50 w-32">
          <button type="button"
                  class="w-full text-left px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-50 bg-transparent border-0 cursor-pointer"
                  data-action="rename-config"
                  data-config-id="{{ cfg.id }}"
                  data-config-name="{{ cfg.name | e }}">
            Rename
          </button>
          <button type="button"
                  class="swap-confirm w-full text-left px-3 py-1.5 text-sm text-red-600 hover:bg-red-50 bg-transparent border-0 cursor-pointer"
                  data-confirm-text="Confirm delete"
                  data-action="delete-config"
                  data-config-id="{{ cfg.id }}"
                  data-config-name="{{ cfg.name | e }}">
            Delete
          </button>
        </div>
      </div>
    </div>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="text-sm text-gray-400">No saved configurations yet.</p>
{% endif %}
