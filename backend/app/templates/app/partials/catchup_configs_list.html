{% if saved_configs %}
<ul class="space-y-1" id="catchup-configs-list">
  {% for cfg in saved_configs %}
  <li class="flex items-center justify-between gap-2 px-3 py-2 rounded border border-gray-200 bg-white hover:bg-gray-50"
      id="catchup-config-{{ cfg.id }}">
    <button type="button"
            class="flex-1 text-left text-sm text-gray-700 truncate cursor-pointer bg-transparent border-0 p-0"
            data-action="load-catchup-config"
            data-config="{{ cfg | catchup_config_json }}">
      {{ cfg.name }}
    </button>
    <div class="flex items-center gap-1 flex-shrink-0">
      <button type="button"
              class="text-gray-400 hover:text-green-600 bg-transparent border-0 cursor-pointer px-1 flex items-center"
              data-action="generate-catchup-config"
              data-config="{{ cfg | catchup_config_json }}"
              title="Load and generate">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </button>
      <button type="button"
              class="text-xs text-gray-400 hover:text-red-600 bg-transparent border-0 cursor-pointer px-1"
              hx-delete="/htmx/catchup-configs/{{ cfg.id }}"
              hx-target="#catchup-configs-list-wrapper"
              hx-swap="innerHTML"
              hx-confirm="Delete '{{ cfg.name }}'?"
              title="Delete config">
        ✕
      </button>
    </div>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="text-sm text-gray-400">No saved configurations yet.</p>
{% endif %}
