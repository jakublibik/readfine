<button hx-post="/htmx/articles/{{ article.id }}/star"
        hx-target="#star-btn-{{ article.id }}"
        hx-swap="innerHTML"
        title="{% if article.is_starred %}Remove star{% else %}Star article{% endif %}"
        class="flex items-center gap-1 px-2 py-1 rounded text-xs border
               {% if article.is_starred %}bg-yellow-50 border-yellow-200 text-yellow-700{% else %}border-gray-200 text-gray-500 hover:bg-gray-50{% endif %}">
  {% if article.is_starred %}★ Starred{% else %}☆ Star{% endif %}
</button>
