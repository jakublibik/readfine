<div class="p-5">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-base font-semibold text-gray-800">Search &amp; filter</h2>
    <button data-action="close-search" class="text-gray-400 hover:text-gray-600 bg-transparent border-0 cursor-pointer p-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Search input -->
  <div class="mb-4">
    <input type="text" id="search-input"
           placeholder="Search articles…"
           class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
           autofocus>
  </div>

  <!-- Sort + status -->
  <div class="mb-4 flex flex-col sm:flex-row gap-3 sm:gap-4">
    <div class="flex-1">
      <label for="search-sort" class="block text-xs font-medium text-gray-600 mb-1">Sort by</label>
      <select id="search-sort"
              class="w-full text-sm border border-gray-300 rounded px-2 py-1.5 text-gray-700 focus:outline-none focus:ring-1 focus:ring-blue-500">
        <option value="relevance"{% if not sort_value or sort_value == 'relevance' %} selected{% endif %}>Relevance</option>
        <option value="newest"{% if sort_value == 'newest' %} selected{% endif %}>Newest first</option>
        <option value="oldest"{% if sort_value == 'oldest' %} selected{% endif %}>Oldest first</option>
      </select>
    </div>
    <div class="flex-1">
      <label for="search-status" class="block text-xs font-medium text-gray-600 mb-1">Status</label>
      <select id="search-status"
              class="w-full text-sm border border-gray-300 rounded px-2 py-1.5 text-gray-700 focus:outline-none focus:ring-1 focus:ring-blue-500">
        <option value="all"{% if not status_value or status_value == 'all' %} selected{% endif %}>All</option>
        <option value="unread"{% if status_value == 'unread' %} selected{% endif %}>Unread</option>
        <option value="read"{% if status_value == 'read' %} selected{% endif %}>Read</option>
      </select>
    </div>
  </div>

  <!-- Scope -->
  <div class="mb-4">
    <label class="block text-xs font-medium text-gray-600 mb-1">Search in</label>
    {% with selector_id = "search-scope" %}
      {% include "app/partials/scope_selector.html" %}
    {% endwith %}
  </div>

  <!-- Labels -->
  {% if labels %}
  <div class="mb-5">
    {% with selector_id = "search-labels" %}
      {% include "app/partials/label_selector.html" %}
    {% endwith %}
  </div>
  {% endif %}

  <!-- Actions -->
  <div class="flex items-center justify-end gap-2">
    <button type="button" data-action="close-search"
            class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 bg-transparent border-0 cursor-pointer">
      Cancel
    </button>
    <button type="button" data-action="submit-search"
            class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded cursor-pointer border-0">
      Search
    </button>
  </div>
</div>
