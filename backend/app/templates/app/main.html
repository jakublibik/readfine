{% extends "base.html" %}

{% block title %}Filtread{% endblock %}

{% block content %}
<!-- Search modal overlay -->
<div id="search-modal-overlay"
     class="hidden fixed inset-0 z-50 flex items-center justify-center">
  <div class="absolute inset-0 bg-black/40" onclick="closeSearchModal()"></div>
  <div id="search-modal-content"
       class="relative bg-white rounded-xl shadow-2xl w-[480px] max-w-[90vw] max-h-[90vh] overflow-y-auto">
  </div>
</div>

<div class="flex h-screen overflow-hidden">

  <!-- Left panel: sidebar -->
  <aside id="sidebar"
         class="{% if pinned %}w-64{% else %}w-12{% endif %} flex-shrink-0 border-r border-gray-200 bg-white overflow-y-auto transition-[width] duration-200"
         hx-get="/htmx/sidebar"
         hx-trigger="load, sidebarRefresh from:body, every 60s"
         hx-swap="innerHTML">
    <div class="p-4 text-gray-400 text-sm">Loading…</div>
  </aside>

  <!-- Middle panel: article list -->
  <section id="article-list"
           class="w-[28rem] flex-shrink-0 border-r border-gray-200 bg-gray-50 overflow-y-auto"
           hx-get="/htmx/articles"
           hx-trigger="load"
           hx-swap="innerHTML">
    <div class="p-4 text-gray-400 text-sm">Loading…</div>
  </section>

  <!-- Right panel: article detail -->
  <main id="article-detail" class="flex-1 overflow-y-auto bg-white">
    <div class="flex items-center justify-center h-full text-gray-400">
      <div class="text-center">
        <svg class="mx-auto mb-3 h-10 w-10 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M19 20H5a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2z"/>
        </svg>
        <p class="text-sm">Select an article to read</p>
      </div>
    </div>
  </main>

</div>
{% endblock %}

{% block scripts %}
<script>
  // ── User menu dropdown ──────────────────────────────────────────
  function toggleUserMenu(dropdownId) {
    const el = document.getElementById(dropdownId);
    if (!el) return;
    const isHidden = el.classList.contains('hidden');
    document.querySelectorAll('#full-menu-dropdown').forEach(d => d.classList.add('hidden'));
    if (isHidden) el.classList.remove('hidden');
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest('#full-menu-container')) {
      document.querySelectorAll('#full-menu-dropdown').forEach(d => d.classList.add('hidden'));
    }
  });

  // ── Search modal ────────────────────────────────────────────────
  function openSearchModal() {
    document.querySelectorAll('#full-menu-dropdown').forEach(d => d.classList.add('hidden'));
    document.getElementById('search-modal-overlay').classList.remove('hidden');
    htmx.ajax('GET', '/htmx/search-modal', { target: '#search-modal-content', swap: 'innerHTML' });
  }

  function closeSearchModal() {
    document.getElementById('search-modal-overlay').classList.add('hidden');
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { closeSearchModal(); return; }
    if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
      e.preventDefault();
      openSearchModal();
    }
  });
</script>
{% endblock %}
