{% extends "base.html" %}

{% block title %}Readfine{% endblock %}

{% block scripts %}
<meta name="app-buckets" data-small="{{ bucket_small_max }}" data-medium="{{ bucket_medium_max }}">
{% endblock %}

{% block content %}
<!-- Mobile sidebar strip (minimizable mode, small bucket only) -->
<div id="mobile-sidebar-strip">
  <button id="mobile-strip-open-btn" class="w-8 h-8 flex items-center justify-center rounded text-gray-500 hover:bg-gray-200" aria-label="Open feeds">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
</div>

<!-- Mobile bottom bar (hideable-up mode, small bucket only) -->
<div id="mobile-bottom-bar">
  <button id="mobile-bottombar-open-btn" class="flex-shrink-0 w-7 h-7 flex items-center justify-center rounded text-gray-500 hover:bg-gray-100" aria-label="Open feeds">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
  <div class="flex-1"></div>
  <button id="mobile-bottom-refresh-btn" type="button"
          class="flex-shrink-0 w-7 h-7 flex items-center justify-center rounded text-gray-500 hover:bg-gray-100" aria-label="Refresh">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
    </svg>
  </button>
  <button id="mobile-bottom-quicklink" type="button"
          class="flex-shrink-0 text-xs leading-none text-blue-500 hover:text-blue-700 bg-transparent border-0 p-0 cursor-pointer whitespace-nowrap">Labels →</button>
</div>

<!-- Mobile title bar (hideable mode, small bucket only) -->
<div id="mobile-title-bar">
  <button id="mobile-titlebar-open-btn" class="flex-shrink-0 w-7 h-7 flex items-center justify-center rounded text-gray-500 hover:bg-gray-100" aria-label="Open feeds">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
  <div class="flex-1 flex items-center gap-1.5 min-w-0">
    <span id="mobile-title-text" class="truncate text-sm font-medium text-gray-700"></span>
    <span id="mobile-title-count" class="hidden"></span>
  </div>
  <button id="mobile-title-quicklink" type="button"
          class="flex-shrink-0 text-xs leading-none text-blue-500 hover:text-blue-700 bg-transparent border-0 p-0 cursor-pointer whitespace-nowrap">Labels →</button>
</div>

<!-- Mobile sidebar backdrop -->
<div id="mobile-sidebar-backdrop"></div>

<!-- Search modal overlay -->
<div id="search-modal-overlay"
     class="hidden fixed inset-0 z-50 flex items-center justify-center">
  <div class="absolute inset-0 bg-black/40" data-action="close-search"></div>
  <div id="search-modal-content"
       class="relative bg-white rounded-xl shadow-2xl w-[480px] max-w-[90vw] max-h-[90vh] overflow-y-auto">
  </div>
</div>

<!-- Global label picker popover -->
<div id="label-picker"
     class="hidden fixed z-50 bg-white border border-gray-200 rounded-lg shadow-lg py-1 min-w-[160px] max-w-[220px] max-h-64 overflow-y-auto"></div>

<!-- Detail share picker (mobile) -->
<div id="detail-share-picker" class="hidden fixed z-50 bg-white border border-gray-200 rounded-lg shadow-lg py-1 min-w-[160px]">
  <button id="detail-share-pick-original" class="w-full text-left flex items-center gap-2 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50">
    <svg class="w-3.5 h-3.5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
    </svg>
    Original article
  </button>
  <button id="detail-share-pick-readfine" class="w-full text-left flex items-center gap-2 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50">
    <svg class="w-3.5 h-3.5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
    </svg>
    Readfine link
  </button>
</div>

<div class="flex h-screen overflow-hidden bg-gray-50">

  <!-- Left panel: sidebar -->
  <aside id="sidebar"
         class="w-60 flex-shrink-0 border-r border-gray-200 bg-gray-50 overflow-y-auto transition-[width] duration-200"
         hx-get="/htmx/sidebar"
         hx-trigger="load, sidebarRefresh from:body, every 300s"
         hx-vals="{}"
         hx-swap="innerHTML">
    <div class="p-4 text-gray-400 text-sm">Loading…</div>
  </aside>

  <!-- Middle panel: article list -->
  <section id="article-list"
           class="flex-shrink-0 border-gray-200 bg-white overflow-y-auto"
           style="width:28rem">
    <div class="p-4 text-gray-400 text-sm">Loading…</div>
  </section>

  <!-- Article list resizer -->
  <div id="article-list-resizer"
       class="flex-shrink-0 w-1 bg-gray-200 hover:bg-blue-400 active:bg-blue-500 transition-colors duration-100 cursor-col-resize"></div>

  <!-- Right panel: article detail -->
  <main id="article-detail" class="flex-1 overflow-y-auto bg-white">
    <div class="flex items-center justify-center h-full text-gray-400">
      <div class="text-center">
        <svg class="mx-auto mb-3 h-10 w-10 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M19 20H5a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2z"/>
        </svg>
        <p class="text-sm">Select an article to read</p>
      </div>
    </div>
  </main>

</div>
{% endblock %}
