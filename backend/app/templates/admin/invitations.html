{% extends "admin/base.html" %}
{% block title %}Invitations – Admin – Readfine{% endblock %}
{% set active = "invitations" %}

{% block admin_content %}
<div class="flex items-center justify-between mb-6">
  <h1 class="text-xl font-semibold text-gray-900">Invitations</h1>
</div>

<!-- Create invitation form -->
<div class="bg-white border border-gray-200 rounded-lg p-4 mb-6">
  <h2 class="text-sm font-medium text-gray-700 mb-3">Create invitation</h2>
  <form hx-post="/admin/invitations"
        hx-target="#invitations-table"
        hx-swap="innerHTML"
        hx-on::after-request="this.reset()"
        class="flex flex-wrap gap-3 items-end">
    <div>
      <label class="block text-xs text-gray-500 mb-1">Email (optional)</label>
      <input type="email" name="email" placeholder="user@example.com"
             class="border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 w-56">
    </div>
    <div>
      <label class="block text-xs text-gray-500 mb-1">Expires (optional)</label>
      <input type="date" name="expires_at"
             class="border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
    </div>
    <button type="submit"
            class="px-4 py-1.5 bg-blue-600 text-white text-sm rounded hover:bg-blue-700">
      Generate link
    </button>
  </form>
</div>

<!-- Invitations table -->
<div class="bg-white border border-gray-200 rounded-lg overflow-hidden">
  <div id="invitations-table">
    {% include "admin/partials/invitations_table.html" %}
  </div>
</div>
{% endblock %}
