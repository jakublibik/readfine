{% extends "base.html" %}
{% block content %}
<div class="min-h-screen bg-gray-50">
  <div class="flex">

    <!-- Admin sidebar -->
    <nav class="w-52 flex-shrink-0 min-h-screen bg-white border-r border-gray-200 px-3 py-6">
      <div class="mb-6">
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Admin</span>
      </div>
      <ul class="space-y-1 text-sm">
        <li><a href="/admin" class="flex items-center px-3 py-2 rounded hover:bg-gray-100 {% if active == 'dashboard' %}bg-gray-100 font-medium{% endif %}">Dashboard</a></li>
        <li><a href="/admin/users" class="flex items-center px-3 py-2 rounded hover:bg-gray-100 {% if active == 'users' %}bg-gray-100 font-medium{% endif %}">Users</a></li>
        <li><a href="/admin/feeds" class="flex items-center px-3 py-2 rounded hover:bg-gray-100 {% if active == 'feeds' %}bg-gray-100 font-medium{% endif %}">Feeds</a></li>
        <li><a href="/admin/invitations" class="flex items-center px-3 py-2 rounded hover:bg-gray-100 {% if active == 'invitations' %}bg-gray-100 font-medium{% endif %}">Invitations</a></li>
        <li><a href="/admin/settings" class="flex items-center px-3 py-2 rounded hover:bg-gray-100 {% if active == 'settings' %}bg-gray-100 font-medium{% endif %}">Settings</a></li>
        <li><a href="/admin/fetch-logs" class="flex items-center px-3 py-2 rounded hover:bg-gray-100 {% if active == 'fetch_logs' %}bg-gray-100 font-medium{% endif %}">Fetch logs</a></li>
        <li><a href="/admin/audit-log" class="flex items-center px-3 py-2 rounded hover:bg-gray-100 {% if active == 'audit_log' %}bg-gray-100 font-medium{% endif %}">Audit log</a></li>
      </ul>
      <div class="mt-8 pt-4 border-t border-gray-200">
        <a href="/app" class="text-xs text-gray-400 hover:text-gray-600">← Back to app</a>
      </div>
    </nav>

    <!-- Main content -->
    <main class="flex-1 px-8 py-6 max-w-5xl">
      {% block admin_content %}{% endblock %}
    </main>

  </div>
</div>
{% endblock %}
