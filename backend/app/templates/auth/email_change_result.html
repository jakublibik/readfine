{% extends "base.html" %}
{% block title %}Email change – Readfine{% endblock %}

{% block content %}
<div class="min-h-screen flex items-start sm:items-center justify-center pt-12 pb-8 sm:py-8">
    <div class="w-full max-w-sm">
        <h1 class="text-2xl font-semibold text-center mb-6">Readfine</h1>

        <div class="bg-white shadow rounded-lg p-6 space-y-4">
            {% if ok %}
            <div class="p-3 bg-green-50 border border-green-200 text-green-700 rounded text-sm">
                {{ message }}
            </div>
            {% else %}
            <div class="p-3 bg-red-50 border border-red-200 text-red-700 rounded text-sm">
                {{ message }}
            </div>
            {% endif %}
            <a href="/login"
                class="block text-center w-full bg-blue-600 text-white rounded px-4 py-2 text-sm hover:bg-blue-700">
                Continue to Readfine
            </a>
        </div>
    </div>
</div>
{% endblock %}
