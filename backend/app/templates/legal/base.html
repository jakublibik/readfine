{% extends "base.html" %}

{% block content %}
<div class="min-h-screen py-12 px-4">
  <div class="max-w-2xl mx-auto">

    <div class="text-center mb-8">
      <a href="/login" class="text-2xl font-semibold text-gray-900 hover:text-gray-700">Readfine</a>
    </div>

    <div class="bg-white shadow rounded-lg px-4 py-6 sm:px-8 sm:py-10">

      <div class="mb-8">
        <h1 class="text-xl font-semibold text-gray-900 mb-1">{% block legal_title %}{% endblock %}</h1>
        {% if legal_last_updated %}
        <p class="text-xs text-gray-400">Last updated: {{ legal_last_updated }}</p>
        {% endif %}
      </div>

      <div class="space-y-8 text-sm text-gray-700">
        {% block legal_content %}{% endblock %}
      </div>

    </div>

    <div class="text-center mt-6 text-xs text-gray-400 space-x-3">
      <a href="/terms" class="hover:text-gray-600 hover:underline">Terms of Service</a>
      <span>·</span>
      <a href="/privacy" class="hover:text-gray-600 hover:underline">Privacy Policy</a>
      <span>·</span>
      <a href="/login" class="hover:text-gray-600 hover:underline">Sign in</a>
    </div>

  </div>
</div>
{% endblock %}
