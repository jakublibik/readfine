<!DOCTYPE html>
<html lang="en" data-font-size="{{ reading_font_size | default('md') }}" data-font-family="{{ reading_font_family | default('sans') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Readfine{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="/static/js/tailwind-config.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <style>
      .prose h1 { font-size: 1.3em !important; }
      .prose h2 { font-size: 1.15em !important; margin-top: 1.4em; margin-bottom: 0.5em; }
      .prose h3 { font-size: 1.05em !important; margin-top: 1.2em; margin-bottom: 0.4em; }
      .prose h4 { font-size: 1.0em !important; margin-top: 1.0em; margin-bottom: 0.4em; }
      .article-row { transition: opacity 150ms ease; }
      html.sidebar-unpinned #sidebar { width: 3rem; }
      html[data-layout="2"] #article-detail { display: none; }
      .article-row .expand-indicator { visibility: hidden; }
      .article-row.inline-expanded .expand-indicator { visibility: visible; }
      .article-row.inline-expanded { box-shadow: inset 0 6px 8px -6px rgba(0,0,0,0.10); }
      .article-row.inline-expanded [data-article-title] { font-weight: 700 !important; }
      .article-row [data-article-title] { color: inherit; text-decoration: none; }
      .article-row.inline-expanded [data-article-title] { cursor: pointer; }
      #inline-article-detail-content .article-detail-title-row { display: none; }
      #inline-article-detail-content .article-detail-meta { padding-left: 0 !important; }
      #inline-article-detail-content article { padding-top: 0.75rem; }
      #inline-article-detail-content .detail-labels-area { display: none; }
      #inline-article-detail-content .detail-meta-feed,
      #inline-article-detail-content .detail-meta-author-sep,
      #inline-article-detail-content .detail-meta-date-sep,
      #inline-article-detail-content .detail-meta-date { display: none; }
      #inline-article-detail-content .flex:not(:has(.detail-meta-author)) .detail-meta-readtime-sep { display: none; }

      /* ── Reading typography ── */
      html[data-font-size="sm"] .prose { font-size: 0.875rem; }
      html[data-font-size="lg"] .prose { font-size: 1.125rem; }
      html[data-font-family="serif"] .prose { font-family: Georgia, "Times New Roman", serif; }
      .prose p, .prose li, .prose blockquote { line-height: 1.6; }
      .prose p { margin-top: 1em; margin-bottom: 1em; }
      .prose img { margin-top: 1em; margin-bottom: 1em; }
      .prose a:has(> img) { display: inline-block; }

      /* ── Mobile (small bucket) ── */
      html[data-bucket="small"] { font-size: 106.25%; }
      html[data-bucket="small"] #article-list [data-article-title] { font-size: 0.9375rem; }
      html[data-bucket="small"] #article-list .text-xs { font-size: 0.8125rem; }
      html[data-bucket="small"] #article-detail article { padding-left: 0.75rem; padding-right: 0.75rem; }
      html[data-bucket="small"] #inline-article-detail-content article { padding-left: 0.75rem; padding-right: 0.75rem; }
      html[data-bucket="small"] #sidebar { display: none; }
      html[data-bucket="small"] #article-list-resizer { display: none; }
      html[data-bucket="small"] #article-detail { display: none; }
      html[data-bucket="small"] #article-list { flex: 1 !important; width: auto !important; }

      /* Collapsible: sidebar visible as rail — must be BEFORE overlay rule */
      html[data-bucket="small"][data-sidebar-mode="collapsible"] #sidebar { display: block; width: 3rem !important; }
      #mobile-sidebar-strip { display: none; }

      /* Sidebar overlay — must be AFTER collapsible rule to win on equal specificity */
      html[data-bucket="small"].mobile-sidebar-open #sidebar {
        display: block !important; position: fixed; left: 0; top: 0; bottom: 0;
        width: 15rem !important; z-index: 30; overflow-y: auto;
      }
      #mobile-sidebar-backdrop { display: none; }
      html[data-bucket="small"].mobile-sidebar-open #mobile-sidebar-backdrop {
        display: block; position: fixed; inset: 0; z-index: 29; background: rgba(0,0,0,0.4);
      }

      /* Hideable: title bar, list offset */
      #mobile-title-bar { display: none; }
      html[data-bucket="small"][data-sidebar-mode="hideable"] #mobile-title-bar {
        display: flex; align-items: center; gap: 0.5rem;
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        height: 2.75rem; background: #f9fafb; border-bottom: 1px solid #e5e7eb; padding: 0 0.75rem;
      }
      html[data-bucket="small"][data-sidebar-mode="hideable"] #article-list { padding-top: 2.75rem; }

      /* Detail fullscreen overlay */
      html[data-bucket="small"].mobile-detail-open #article-detail {
        display: block !important; position: fixed; inset: 0; z-index: 40;
        background: white; overflow-y: auto; padding-top: 2.75rem;
      }
      #mobile-detail-back-bar { display: none; }
      html[data-bucket="small"].mobile-detail-open #article-detail article { padding-top: 0.75rem; }
      html[data-bucket="small"].mobile-detail-open #article-detail article header { margin-bottom: 0.75rem; }
      html[data-bucket="small"] #inline-article-detail-content article header { margin-bottom: 0.75rem; }
      html[data-bucket="small"].mobile-detail-open #article-detail [id^="star-btn-"] { display: none; }
      html[data-bucket="small"].mobile-detail-open #article-detail .article-detail-menu { display: none; }
      html[data-bucket="small"].mobile-detail-open #article-detail .article-detail-meta { padding-left: 0; }
      html[data-bucket="small"].mobile-detail-open #article-detail .detail-meta-feed,
      html[data-bucket="small"].mobile-detail-open #article-detail .detail-meta-author-sep,
      html[data-bucket="small"].mobile-detail-open #article-detail .detail-meta-date-sep,
      html[data-bucket="small"].mobile-detail-open #article-detail .detail-meta-date { display: none; }
      html[data-bucket="small"].mobile-detail-open #article-detail .flex:not(:has(.detail-meta-author)) .detail-meta-readtime-sep { display: none; }
      html[data-bucket="small"].mobile-detail-open #mobile-detail-back-bar {
        display: flex; align-items: center; gap: 0.5rem;
        position: fixed; top: 0; left: 0; right: 0; z-index: 41;
        height: 2.75rem; background: #f9fafb; border-bottom: 1px solid #e5e7eb; padding: 0 0.75rem;
      }
    </style>
    <script src="/static/js/init.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="/static/js/csrf.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-900">
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
