<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Readfine{% endblock %}</title>
    <script src="/static/js/tailwind-config.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <style>
      .prose h1 { font-size: 1.1em !important; }
      .prose h2 { font-size: 1.0em !important; }
      .prose h3 { font-size: 0.95em !important; }
      .prose h4 { font-size: 0.9em !important; }
      .article-row { transition: opacity 150ms ease; }
      html.sidebar-unpinned #sidebar { width: 3rem; }
    </style>
    <script>
      (function () {
        var pinned = true;
        try { pinned = localStorage.getItem('sidebarPinned') !== 'false'; } catch (e) {}
        window._sidebarPinned = pinned;
        if (!pinned) document.documentElement.classList.add('sidebar-unpinned');
      })();
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="/static/js/csrf.js"></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-900">
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
