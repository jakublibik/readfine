{% extends "base.html" %}
{% block title %}Feeds – Filtread{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-xl font-semibold text-gray-900">Feeds</h1>
    <div class="flex items-center gap-4">
      <a href="/settings/labels" class="text-sm text-blue-600 hover:underline">Labels</a>
      <a href="/settings/filters" class="text-sm text-blue-600 hover:underline">Filters</a>
      <a href="/settings/preferences" class="text-sm text-blue-600 hover:underline">Preferences</a>
    </div>
  </div>

  <!-- Subscribe form -->
  <div class="mb-8 p-4 bg-gray-50 border border-gray-200 rounded">
    <h2 class="text-sm font-medium text-gray-700 mb-3">Subscribe to a feed</h2>
    {% if error %}
      <p class="text-sm text-red-500 mb-3">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/settings/feeds" hx-boost="true" class="space-y-3">
      <div class="flex gap-3">
        <input type="url" name="url" placeholder="https://example.com/feed.xml" required
               value="{{ subscribe_url or '' }}"
               class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
        <button type="submit"
                class="px-4 py-1.5 bg-blue-600 text-white text-sm rounded hover:bg-blue-700 whitespace-nowrap">
          Subscribe
        </button>
      </div>
      <div class="flex gap-3">
        <input type="text" name="custom_title" placeholder="Custom title (optional)"
               class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
        <select name="folder_id" class="border border-gray-300 rounded px-2 py-1.5 text-sm">
          <option value="">No folder</option>
          {% for folder in folders %}
            <option value="{{ folder.id }}">{{ folder.name }}</option>
          {% endfor %}
        </select>
      </div>
    </form>
  </div>

  <!-- Feeds + folders list -->
  <div id="feeds-list">
    {% include "settings/partials/feeds_list.html" %}
  </div>

  <!-- Add folder -->
  <div class="mt-6 pt-4 border-t border-gray-200">
    <h2 class="text-sm font-medium text-gray-700 mb-2">Add folder</h2>
    <form hx-post="/settings/folders"
          hx-target="#feeds-list"
          hx-swap="outerHTML"
          class="flex gap-3">
      <input type="text" name="name" placeholder="Folder name" required
             class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
      <button type="submit"
              class="px-3 py-1.5 bg-gray-600 text-white text-sm rounded hover:bg-gray-700">
        Create
      </button>
    </form>
  </div>

  <div class="mt-6">
    <a href="/app" class="text-sm text-gray-500 hover:underline">← Back to reader</a>
  </div>
</div>
{% endblock %}
