<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ subject }}</title>
<style>
  body { margin: 0; padding: 0; background-color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #18181b; }
  .header-title { font-size: 18px; font-weight: 600; color: #18181b; margin: 0 0 2px 0; }
  .header-meta { font-size: 12px; color: #71717a; margin: 0; }
  .content h1 { font-size: 20px; font-weight: 700; color: #18181b; margin: 0 0 12px 0; line-height: 1.3; }
  .content h2 { font-size: 16px; font-weight: 600; color: #18181b; margin: 24px 0 8px 0; line-height: 1.3; border-bottom: 1px solid #e4e4e7; padding-bottom: 4px; }
  .content h3 { font-size: 14px; font-weight: 600; color: #3f3f46; margin: 16px 0 6px 0; }
  .content p { font-size: 14px; line-height: 1.6; color: #3f3f46; margin: 0 0 12px 0; }
  .content ul, .content ol { font-size: 14px; line-height: 1.6; color: #3f3f46; margin: 0 0 12px 0; padding-left: 20px; }
  .content li { margin-bottom: 4px; }
  .content strong { font-weight: 600; color: #18181b; }
  .content em { font-style: italic; }
  .content hr { border: none; border-top: 1px solid #e4e4e7; margin: 20px 0; }
  .footer-text { font-size: 11px; color: #a1a1aa; margin: 0; line-height: 1.5; }
  .footer-text a { color: #a1a1aa; text-decoration: underline; }
  @media (max-width: 600px) {
    .card { width: 100% !important; }
    .pad { padding-left: 12px !important; padding-right: 12px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f4f5" style="background-color:#f4f4f5;">
  <tr>
    <td align="center" style="padding:24px 4px;">
      <table role="presentation" class="card" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:600px;max-width:600px;background-color:#ffffff;">
        <tr>
          <td class="pad" bgcolor="#ffffff" style="padding:20px 20px 16px;border-bottom:1px solid #e4e4e7;">
            <p class="header-title">{{ config_name }}</p>
            <p class="header-meta">{{ period_label }} &middot; {{ date_label }}</p>
          </td>
        </tr>
        <tr>
          <td class="content pad" bgcolor="#ffffff" style="padding:24px 20px;">
            {{ content | safe }}
          </td>
        </tr>
        <tr>
          <td class="pad" bgcolor="#fafafa" style="padding:16px 20px;border-top:1px solid #e4e4e7;background-color:#fafafa;">
            <p class="footer-text">This briefing was generated by <strong>Readfine</strong> based on {{ article_count }} article{{ "s" if article_count != 1 else "" }}. Generated on {{ date_label }}.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
