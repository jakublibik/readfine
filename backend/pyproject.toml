[project]
name = "readfine"
version = "0.1.0"
description = "Self-hosted RSS reader"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Auth & security
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "itsdangerous>=2.2.0",
    "starlette-csrf>=3.0.0",
    "slowapi>=0.1.9",
    # Config
    "pydantic-settings>=2.3.0",
    "pydantic[email]>=2.7.0",
    # RSS fetching
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    # Readable extraction
    "trafilatura>=1.12.0",
    "readability-lxml>=0.8.1",
    # Web scraping
    "beautifulsoup4>=4.12.0",
    # HTML sanitization
    "nh3>=0.2.17",
    # Safe XML parsing
    "defusedxml>=0.7.1",
    # Scheduler
    "apscheduler>=3.10.4",
    # Email
    "aiosmtplib>=3.0.0",
    # Encryption
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
