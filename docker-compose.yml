# Cap container log size so the json-file driver can't fill the host disk.
# Covers app + nginx (nginx:alpine symlinks its access/error logs to stdout/stderr).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-readfine}
      POSTGRES_USER: ${DB_USER:-readfine}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-readfine}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-readfine}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    # uvicorn must NOT rewrite client.host from X-Forwarded-* — the app resolves
    # the real client itself (TRUSTED_PROXY_COUNT / TRUST_CLOUDFLARE in .env).
    # Keep --workers 1: rate limiting and the login lockout are in-memory and
    # only correct with a single worker (see README). More workers split the
    # counters per worker and weaken brute-force protection.
    # --no-access-log: nginx fronts every request and already access-logs; the
    # uvicorn access log would be a duplicate copy of each request line,
    # including one-time tokens in verify-email / reset-password URLs.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --no-access-log"
    env_file: .env
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  postgres_data:
